<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rental Yield Calculator — Gross & Net Yield | Tabutility</title>
  <meta name="description" content="Calculate gross and net rental yield on investment properties. Includes all costs like maintenance, insurance, management fees and mortgage." />
  <meta name="keywords" content="rental yield calculator, gross rental yield, net rental yield, buy to let yield, property investment calculator" />
  <link rel="canonical" href="https://rental-yield.tabutility.com/" />
  <meta property="og:title" content="Rental Yield Calculator" />
  <meta property="og:description" content="Calculate gross and net rental yield on any property including all costs." />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏘️</text></svg>" />
  <meta name="robots" content="index, follow" />
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7039091592734005" crossorigin="anonymous"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78VZWJ5B1W"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-78VZWJ5B1W');</script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;background:#f8faff;font-family:'Segoe UI',Arial,sans-serif">
<div id="root"></div>
<script type="text/babel">
//<![CDATA[
const { useState } = React;
function fmt(n,d=0){return '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});}
function fmtPct(n){return n.toFixed(2)+'%';}

function App() {
  const [propValue, setPropValue] = useState(350000);
  const [monthlyRent, setMonthlyRent] = useState(2200);
  const [mortgage, setMortgage] = useState(1200);
  const [mgmt, setMgmt] = useState(10);
  const [maintenance, setMaintenance] = useState(100);
  const [insurance, setInsurance] = useState(100);
  const [voidMonths, setVoid] = useState(1);
  const [currency, setCurrency] = useState('$');

  const pv = Number(propValue)||0;
  const mr = Number(monthlyRent)||0;
  const mo = Number(mortgage)||0;
  const mgmtAmt = mr * Number(mgmt)/100;
  const maint = Number(maintenance)||0;
  const ins = Number(insurance)||0;
  const vm = Number(voidMonths)||0;

  const annualRent = mr * (12 - vm);
  const annualCosts = (mo + mgmtAmt + maint + ins) * 12;
  const netAnnual = annualRent - annualCosts;

  const grossYield = pv > 0 ? mr * 12 / pv * 100 : 0;
  const netYield = pv > 0 ? netAnnual / pv * 100 : 0;

  const yieldColor = (y) => y >= 7 ? '#16a34a' : y >= 5 ? '#d97706' : '#dc2626';

  return (
    <div style={{maxWidth:520,margin:'0 auto',paddingBottom:40}}>
      <div style={{background:'#1a1a2e',padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <a href="https://tabutility.com" style={{color:'#a5b4fc',textDecoration:'none',fontSize:14}}>← All Tools</a>
        <span style={{color:'#fff',fontWeight:700,fontSize:15}}>⚡ Tabutility</span>
      </div>
      <div style={{background:'linear-gradient(135deg,#0369a1,#0c4a6e)',padding:'28px 20px',textAlign:'center',color:'#fff'}}>
        <div style={{fontSize:36,marginBottom:8}}>🏘️</div>
        <h1 style={{margin:'0 0 6px',fontSize:22,fontWeight:900}}>Rental Yield Calculator</h1>
        <p style={{margin:0,fontSize:13,opacity:0.85}}>Gross &amp; net yield · cash flow · property ROI</p>
      </div>
      <div style={{padding:20}}>
        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)',marginBottom:16}}>
          <div style={{marginBottom:10}}>
            <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:5}}>Currency</label>
            <select value={currency} onChange={e=>setCurrency(e.target.value)}
              style={{width:'100%',padding:'10px',borderRadius:10,border:'2px solid #e5e7eb',fontSize:14,background:'#fff'}}>
              {[['$','USD ($)'],['£','GBP (£)'],['€','EUR (€)'],['A$','AUD (A$)']].map(([v,l])=><option key={v} value={v}>{l}</option>)}
            </select>
          </div>
          {[
            ['Property Value',propValue,setPropValue,'Purchase price'],
            ['Monthly Rent',monthlyRent,setMonthlyRent,'Gross rent received'],
            ['Monthly Mortgage',mortgage,setMortgage,'0 if owned outright'],
            ['Monthly Maintenance',maintenance,setMaintenance,'Repairs & upkeep'],
            ['Monthly Insurance',insurance,setInsurance,'Buildings & landlord'],
          ].map(([l,v,s,hint])=>(
            <div key={l} style={{marginBottom:12}}>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:3}}>{l}</label>
              <div style={{fontSize:11,color:'#9ca3af',marginBottom:4}}>{hint}</div>
              <div style={{position:'relative'}}>
                <span style={{position:'absolute',left:10,top:'50%',transform:'translateY(-50%)',color:'#9ca3af'}}>{currency}</span>
                <input type="number" value={v} onChange={e=>s(e.target.value)}
                  style={{width:'100%',padding:'9px 9px 9px 26px',borderRadius:10,border:'1px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
              </div>
            </div>
          ))}
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:5}}>Mgmt Fee (%)</label>
              <input type="number" value={mgmt} onChange={e=>setMgmt(e.target.value)} step={0.5}
                style={{width:'100%',padding:'9px 12px',borderRadius:10,border:'1px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
            </div>
            <div>
              <label style={{fontSize:13,fontWeight:600,color:'#374151',display:'block',marginBottom:5}}>Void Months / Year</label>
              <input type="number" value={voidMonths} onChange={e=>setVoid(e.target.value)} min={0} max={12}
                style={{width:'100%',padding:'9px 12px',borderRadius:10,border:'1px solid #e5e7eb',fontSize:15,boxSizing:'border-box'}} />
            </div>
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginBottom:16}}>
          {[['GROSS YIELD',grossYield,'Annual rent ÷ property value'],['NET YIELD',netYield,'After all costs & voids']].map(([t,y,sub])=>(
            <div key={t} style={{background:'#fff',borderRadius:14,padding:16,textAlign:'center',boxShadow:'0 2px 10px rgba(0,0,0,0.06)'}}>
              <div style={{fontSize:11,fontWeight:700,color:'#6b7280'}}>{t}</div>
              <div style={{fontSize:38,fontWeight:900,color:yieldColor(y),margin:'6px 0'}}>{fmtPct(y)}</div>
              <div style={{fontSize:11,color:'#9ca3af'}}>{sub}</div>
            </div>
          ))}
        </div>

        <div style={{background:'#fff',borderRadius:14,padding:20,boxShadow:'0 2px 12px rgba(0,0,0,0.06)'}}>
          {[
            ['Annual Gross Rent', fmt(mr*12)],
            ['Rent Lost to Voids', '-'+fmt(mr*vm)],
            ['Effective Annual Rent', fmt(annualRent)],
            ['Annual Costs', '-'+fmt(annualCosts)],
            ['Net Annual Income', fmt(netAnnual)],
            ['Monthly Cash Flow', fmt(netAnnual/12)],
            ['Gross Yield', fmtPct(grossYield)],
            ['Net Yield', fmtPct(netYield)],
          ].map(([l,v])=>(
            <div key={l} style={{display:'flex',justifyContent:'space-between',padding:'9px 0',borderBottom:'1px solid #f0f0f0',fontSize:14}}>
              <span style={{color:'#6b7280'}}>{l}</span>
              <strong style={{color:l.includes('Net Annual')&&netAnnual<0?'#dc2626':l.includes('Net Annual')&&netAnnual>0?'#16a34a':'#1a1a2e'}}>{v}</strong>
            </div>
          ))}
        </div>
        <div style={{background:'#e0f2fe',borderRadius:12,padding:16,marginTop:16,fontSize:13,color:'#0c4a6e',lineHeight:1.6}}>
          <strong>Yield benchmarks:</strong> Below 5% — marginal; 5–7% — decent; 7%+ — strong. Net yield accounts for all costs and void periods — it's the real return. Gross yield is useful for quick comparison.
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
//]]>
</script>
</body>
</html>
